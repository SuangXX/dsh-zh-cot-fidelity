# dsh-zh-cot-fidelity bundle patch
# 在 profile 根作用域插入一行：注册全局系统提示词 section（对所有会话生效）。
#
# 入口表 entries 决定「规则发到哪里」（位置 = order，越大越靠后）：
#   body  order 10150    默认开，与 1.0.0 行为等价
#   head  order -100000  默认关；打开后排在 HARNESS_IDENTITY(-1000) 之前
#   post  order 5100     默认关；把补充文本写进 config.entries.post.text 即可
#   file  order 10150    默认关；读 $DSH_HOME/zh-cot-fidelity/rules/ 下的规则集
#
# 例：前置硬规则 + 关掉霸总腔
#   config:
#     antiBoss: false
#     entries:
#       head: { order: -100000, source: 'builtin:boundary', enabled: true }
#
# 改规则文本（规则文件 / entries 的 text）不需要重启，下一轮组装生效。
# 改位置与开关（order / enabled / source）**同样不需要重启**：宿主 dsh-hmr 用 chokidar
# 盯着 profile 的 cordis.patch.yml 与 package.json，保存即触发 config reload
# （配置监听默认开写稳定化，会防抖一两秒）。
# 只有部署插件代码（*.js）才需要重启 —— 模块已加载进内存，不会重新 import。
- insert:
    - id: zh-cot-fidelity
      name: 'dsh-zh-cot-fidelity'
      config:
        suppressRuntimeContext: true
        entries:
          head:
            order: -100000
            source: builtin:boundary
            enabled: true
          precedence:
            order: 100
            source: rules:precedence
            enabled: true
          scene-work:
            order: 10200
            source: rules:scene-work
            enabled: true
          scene-chat:
            order: 10210
            source: rules:scene-chat
            enabled: true
          style-intimate:
            order: 10300
            source: rules:style-intimate
            enabled: true
          style-violence:
            order: 10310
            source: rules:style-violence
            enabled: true
          style-nsfw:
            order: 10320
            source: rules:style-nsfw
            enabled: true
          universal:
            order: 10330
            source: rules:universal
            enabled: false
          universal-plus:
            order: 10340
            source: rules:universal-plus
            enabled: false
