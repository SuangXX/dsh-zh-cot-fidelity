# 发布到 npm：release 建好时自动跑，也可以手动触发。
#
# 注意：这个包没有 dependencies，也没有 package-lock.json，所以不能用 npm ci
# （npm ci 没有 lockfile 会直接报 EUSAGE）。用 npm install 即可；
# 将来真加了依赖，记得把 lockfile 一起提交。

name: Node.js Package

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - run: npm install --no-audit --no-fund
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{secrets.npm_token}}
