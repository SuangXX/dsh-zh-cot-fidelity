# 发布到 npm：release 建好时自动跑，也可以手动触发。
#
# 认证走 npm Trusted Publishing（OIDC），不需要 NPM_TOKEN secret：
# 前提是在 npm 包的 Settings → Trusted publishing 里登记了
#   Provider: GitHub Actions
#   Repository: SuangXX/dsh-zh-cot-fidelity
#   Workflow: npm-publish.yml
# 没有这个登记，npm publish 会 401 ENEEDAUTH。
# 需要 npm >= 11.5.1（Node 24 自带；Node 22 自带的 npm 10 不支持 OIDC）。
#
# 注意：这个包没有 dependencies，也没有 package-lock.json，所以不能用 npm ci
# （npm ci 没有 lockfile 会直接报 EUSAGE）。用 npm install 即可；
# 将来真加了依赖，记得把 lockfile 一起提交。

name: Node.js Package

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm test

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 故意不写 registry-url：它会让 setup-node 往 .npmrc 里写入
          # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}，OIDC 下这个变量是空的，
          # 空 token 会让 npm 认为已经配了认证、跳过 OIDC 交换，最后带空 Bearer 去 PUT，
          # npmjs 对这种请求返回 404（不是 401）。对应日志是 provenance 签名成功、
          # 紧接着 E404 Not found —— 1.6.2 第一次 OIDC 发布就栽在这。
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: 清掉 .npmrc 里可能残留的空 _authToken（有就让 OIDC 短路）
        run: |
          NPMRC="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          [ -f "$NPMRC" ] && sed -i '/_authToken/d' "$NPMRC" || true
          [ -f "$HOME/.npmrc" ] && [ "$HOME/.npmrc" != "$NPMRC" ] && sed -i '/_authToken/d' "$HOME/.npmrc" || true
      - name: 诊断 OIDC 环境（不打印 token 本身）
        run: |
          echo "GITHUB_ACTIONS=${GITHUB_ACTIONS:-missing}"
          echo "ACTIONS_ID_TOKEN_REQUEST_URL: $([ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && echo present || echo missing)"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN: $([ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ] && echo present || echo missing)"
          echo "repository claim: $GITHUB_REPOSITORY"
          echo "workflow file: $GITHUB_WORKFLOW_REF"
          echo "environment claim: ${GITHUB_ACTIONS_RUNNER_ENVIRONMENT:-none}"
      - run: npm publish --provenance --access public --loglevel verbose
